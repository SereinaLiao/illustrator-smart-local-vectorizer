<!doctype html><meta charset="utf-8"><title>Smart Local Vectorizer</title>
<style>*{box-sizing:border-box}body{background:#232527;color:#e8eaec;font:13px "Segoe UI",sans-serif;margin:14px}button,select,input{background:#393d40;color:white;border:1px solid #575c60;border-radius:4px;padding:5px}button{cursor:pointer}button:disabled{opacity:.45}header,section{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}#viewport{height:250px;overflow:auto;background:#171819}#stage{position:relative}canvas,svg{position:absolute;top:0;left:0;width:100%;height:100%}svg{touch-action:none}label{display:flex;align-items:center;justify-content:space-between;margin:5px 0}input[type=range]{width:45%}.roi{stroke:#62b8ff;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:5 4;animation:march 1s linear infinite}@keyframes march{to{stroke-dashoffset:-18}}#apply{background:#206caa}output{color:#a9d8ff}</style>
<header><button id="load">Load selected bitmap</button><select id="zoom"><option>100%</option><option>200%</option><option>400%</option></select><select id="language" aria-label="语言 / Language"><option value="zh">中文</option><option value="en">EN</option></select></header>
<section><select id="tool"><option>Select Region</option><option>Lasso</option><option>Smart Select</option></select><select id="op"><option>Replace</option><option>Add</option><option>Subtract</option></select><select id="mode"><option>Object</option><option>Color</option><option>Edge</option></select></section>
<div id="viewport"><div id="stage"><canvas id="bitmap"></canvas><svg id="overlay"><g id="regions"></g><g id="paths"></g></svg></div></div>
<div id="params"></div><label>Preserve corners<input id="corners" type="checkbox" checked></label><label>Target color<input type="color" id="target" value="#28aeff"></label>
<section>Fill <input type="color" id="fill" value="#28aeff"> Stroke <input id="outlined" type="checkbox"><input type="color" id="stroke"></section>
<section><button id="run">Vectorize</button><button id="cancel">Cancel</button><button id="apply" disabled>Apply to Illustrator</button><button id="save" disabled>Export SVG</button></section><output id="status">Select a bitmap in Illustrator.</output><script src="panel.js"></script>
